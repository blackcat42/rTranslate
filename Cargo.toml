[package]
name = "rTranslate"
version = "0.3.0"
authors = ["sergey gapchenko <gapchenko42@gmail.com>"]
edition = "2024"
publish = false

[dependencies]
which = "8.0.0"
fltk = { version = "^1.5", features = ["fltk-bundled"] } #"static-msvcrt", "no-gdiplus"
anyhow = "1.0.100"
ureq = { version = "=3.3.0", features = ["socks-proxy"] }
image = "0.25.9"
#tray-icon = "0.24.1"
tray-item = { git = "https://github.com/blackcat42/tray-item-rs.git", rev = "e704ecc" }
get-selected-text = "=0.1.6" #todo: high ram usage
unicode-truncate = "2.0.1"
#global-hotkey = "0.8.0"
#global-hotkey = { path = "./global-hotkey-global-hotkey" }
global-hotkey = { git = "https://github.com/blackcat42/global-hotkey.git", rev = "7952f87" }
#handy-keys = "=0.3.4"
rusqlite = { version = "0.38.0", features = ["bundled"] }
twox-hash = "2.1.2"
strum = "0.27.2"
strum_macros = "0.27.2"
rodio = { version = "0.21.1", features = ["playback"] }
regex = "1.12.3"
fancy-regex = "0.17.0"
serde = "1.0.228"
serde_json = "1.0.149"
json5 = "1.3.1"
#whichlang = "0.1.1"
#isolang = { version = "2.4.0", default-features = false }
whatlang = "0.18.0"
fltk-theme = "0.7"
#colornames = "0.0.6"
#windows = { version = "0.58.0", features = ["Win32_UI_WindowsAndMessaging"] }
debug_print = "1.0.0"
unicode-segmentation = "1.13.3"
sys-locale = "0.3.2"
single-instance = "0.3.3"

windows-sys = { version = "0.59", features = ["Win32_System_SystemInformation"] }

#tokio = { version = "1.50.0", features = ["rt", "rt-multi-thread"] }
#wreq = { version = "5.3.0", features = ["gzip", "stream", "cookies"] }
#wreq-util = "2.2.6"
sanitize-filename = "0.6.0"
urlencoding = "2.1.3"
html-escape = "0.2.14"

xcap = "0.9.6"
#bincode = "=1.3.3"
base64 = "=0.22.1"

#[target.'cfg(target_os = "windows")'.dependencies]
#native-windows-gui = { version = "1.0.10", default-features=false, features=["tray-notification", "message-window", "menu", "cursor"] }

[build-dependencies]
embed-resource = "2.3"
thunk-rs = { version = "0.3.5", features = ["xp", "subsystem_windows"] } #"subsystem_windows", , "vc_ltl_only"
winres = "0.1.12"

[profile.release]
strip = true
#codegen-units = 1
#panic = "abort"
lto = true
opt-level = "z"
